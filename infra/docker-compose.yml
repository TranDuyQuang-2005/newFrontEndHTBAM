name: htbam-angular
x-backend-build: &backend-build
  context: ..
  dockerfile: services/backend/Dockerfile
x-database-env: &database-env
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
  ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=HTBAM;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False"
  Database__MigrationDirectory: "/app/migrations"
  Seed__Development: "${Seed__Development:-false}"
  SEED_DEFAULT_PASSWORD: "${SEED_DEFAULT_PASSWORD:-HTBAM-Local-Demo!2026#}"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - "htbam-sql:/var/opt/mssql"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: htbam-angular-backend
    build: *backend-build
    command: ["--migrate"]
    environment: *database-env
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  seed:
    image: htbam-angular-backend
    build: *backend-build
    command: ["--seed"]
    environment: *database-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "htbamadmin"
      MINIO_ROOT_PASSWORD: "HTBAM-Dev-Storage-2026!"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "htbam-minio:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20

  ai:
    build: ../services/ai
    gpus: all
    environment:
      HTBAM_MODEL_DIR: "/models/htbamx"
      HTBAM_DEVICE: "${HTBAM_DEVICE:-auto}"
      HTBAM_FULL_SESSION_PIPELINE: "true"
      HTBAM_TRAINING_ROOT: "/training"
      HTBAM_CHUNK_SECONDS: "12"
      HTBAM_IDENTITY_MIN_SIMILARITY: "0.60"
      HTBAM_IDENTITY_MIN_MARGIN: "0.10"
      HTBAM_IDENTITY_MIN_FACE_SAMPLES: "2"
      HTBAM_UNKNOWN_LINK_SIMILARITY: "0.55"
      HTBAM_MIN_OBSERVATION: "0.20"
    volumes:
      - "../services/ai/models:/models:ro"
      - "E:/HTBAM_X_official_incremental_checked:/training:ro"
      - "E:/HTBAM_X_official_incremental_checked/pretrained/torch-cache:/root/.cache/torch:ro"
    ports:
      - "8001:8001"
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    image: htbam-angular-backend
    build: *backend-build
    environment:
      <<: *database-env
      AiService__BaseUrl: "http://ai:8001/"
      AiService__CallbackApiKey: "CHANGE_AI_CALLBACK_KEY"
      Llm__Enabled: "true"
      Llm__Provider: "GEMINI"
      Llm__Model: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ObjectStorage__Endpoint: "minio:9000"
      ObjectStorage__PublicEndpoint: "localhost:9000"
      ObjectStorage__AccessKey: "htbamadmin"
      ObjectStorage__SecretKey: "HTBAM-Dev-Storage-2026!"
      ObjectStorage__Bucket: "htbam-private"
      ObjectStorage__Secure: "false"
      PublicBaseUrl: "http://backend:8080"
    ports:
      - "5000:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8080/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "on-failure:3"

  web:
    build: ../apps/web
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  htbam-sql:
    external: true
    name: infra_htbam-sql

  htbam-minio:
