name: htbam-angular
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - "htbam-sql:/var/opt/mssql"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "htbamadmin"
      MINIO_ROOT_PASSWORD: "HTBAM-Dev-Storage-2026!"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "htbam-minio:/data"
    restart: unless-stopped

  ai:
    build: ../services/ai
    gpus: all
    environment:
      HTBAM_MODEL_DIR: "/models/htbamx"
      HTBAM_DEVICE: "${HTBAM_DEVICE:-auto}"
      HTBAM_FULL_SESSION_PIPELINE: "true"
      HTBAM_TRAINING_ROOT: "/training"
      HTBAM_CHUNK_SECONDS: "12"
      HTBAM_IDENTITY_MIN_SIMILARITY: "0.60"
      HTBAM_IDENTITY_MIN_MARGIN: "0.10"
      HTBAM_IDENTITY_MIN_FACE_SAMPLES: "2"
      HTBAM_UNKNOWN_LINK_SIMILARITY: "0.55"
      HTBAM_MIN_OBSERVATION: "0.20"
    volumes:
      - "../services/ai/models:/models:ro"
      - "E:/HTBAM_X_official_incremental_checked:/training:ro"
      - "E:/HTBAM_X_official_incremental_checked/pretrained/torch-cache:/root/.cache/torch:ro"
    ports:
      - "8001:8001"
    expose:
      - "8001"
    restart: unless-stopped

  backend:
    build: ../services/backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=HTBAM;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False"
      AiService__BaseUrl: "http://ai:8001/"
      AiService__CallbackApiKey: "CHANGE_AI_CALLBACK_KEY"
      Llm__Enabled: "true"
      Llm__Provider: "GEMINI"
      Llm__Model: "${GEMINI_MODEL:-gemini-2.5-pro}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ObjectStorage__Endpoint: "minio:9000"
      ObjectStorage__PublicEndpoint: "localhost:9000"
      ObjectStorage__AccessKey: "htbamadmin"
      ObjectStorage__SecretKey: "HTBAM-Dev-Storage-2026!"
      ObjectStorage__Bucket: "htbam-private"
      ObjectStorage__Secure: "false"
      PublicBaseUrl: "http://backend:8080"
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
      - minio
      - ai
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8080/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure

  web:
    build: ../apps/web
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  htbam-sql:
    external: true
    name: infra_htbam-sql

  htbam-minio:
